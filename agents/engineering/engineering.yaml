# Engineering department.
# enabled: false = defined in the org chart, no implementation yet (shown as an empty desk).
- id: technical_director_01
  name: Vikram
  role: Technical Director / Code Reviewer
  responsibilities:
  - independent code review
  - architecture decisions
  - engineering standards
  enabled: true
  supervisor: producer_01
  model:
    tier: strong
  tools:
  - read_file
  - list_dir
  - search_files
  - find_symbol
  - find_references
  - inspect_dependencies
  - analyze_impact
  - analyze_call_graph
  - knowledge_search
  - git_diff
  - git_status
  permissions:
    read_docs: 'YES'
    read_code: 'YES'
    knowledge_search: 'YES'
    git_read: 'YES'
    unreal_read: 'YES'
    write_code: 'NO'
    git_commit: 'NO'
    merge: 'NO'
    deploy: 'NO'
    unreal_editor_modify: 'NO'
  avatar:
    room: engineering
    color: '#7a5cff'
    desk: 0
  capability: reviewer
  max_iterations: 20
  cost_budget: 3.0
