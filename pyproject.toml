[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shunya-studio"
version = "0.1.0"
description = "Shunya Studio AI - an agentic game-development company for Unreal Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
redis = ["redis>=5.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[project.scripts]
shunya = "shunya.cli:main"

[tool.setuptools.packages.find]
include = ["shunya*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unreal: needs a local Unreal Engine install (skipped otherwise)",
]
